<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDPA</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background: #08090c;
      color: #f4f4f1;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(115, 111, 145, .14), transparent 34rem),
        linear-gradient(180deg, #0d0e13 0%, #08090c 58%, #06070a 100%);
    }
    .gate {
      position: relative;
      width: min(100%, 390px);
      padding: 34px 32px 30px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 18px;
      background: rgba(15, 16, 22, .88);
      box-shadow: 0 28px 90px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.03);
      backdrop-filter: blur(16px);
    }
    .gate::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 1px;
      margin: 26px 0 26px -1px;
      background: linear-gradient(transparent, rgba(173,168,210,.55), transparent);
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #8e8b9b;
      font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 28px;
      font-size: clamp(27px, 6vw, 34px);
      line-height: 1.45;
      font-weight: 560;
      letter-spacing: -.035em;
    }
    form { display: grid; gap: 12px; }
    label {
      color: #aaa8b3;
      font-size: 12px;
      letter-spacing: .04em;
    }
    input,
    button {
      width: 100%;
      min-height: 48px;
      border-radius: 11px;
      font: inherit;
    }
    input {
      border: 1px solid rgba(255,255,255,.11);
      outline: none;
      padding: 0 14px;
      color: #f8f7fb;
      background: #0a0b0f;
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    input:focus {
      border-color: rgba(176,171,214,.58);
      box-shadow: 0 0 0 3px rgba(151,145,190,.12);
    }
    button {
      margin-top: 4px;
      border: 1px solid rgba(255,255,255,.1);
      color: #111218;
      background: #dddbe7;
      font-weight: 650;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease;
    }
    button:hover { background: #f0eef7; transform: translateY(-1px); }
    button:focus-visible { outline: 2px solid #d7d3ee; outline-offset: 3px; }
    .auth-error {
      margin: 2px 0 0;
      color: #d7a8ad;
      font-size: 12px;
    }
    @media (max-width: 480px) {
      body { padding: 18px; }
      .gate { padding: 30px 24px 26px; border-radius: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      input, button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="gate">
    <p class="eyebrow">restricted / cdpa</p>
    <h1>あなたは誰？<br>ここで何をしているの？</h1>
    <form method="post" action="/auth/login">
      <label for="password">合言葉</label>
      <input id="password" name="password" type="password" placeholder="パスワード" autocomplete="current-password" required autofocus>
      <!--AUTH_ERROR-->
      <button type="submit">入る</button>
    </form>
  </main>
</body>
</html>
